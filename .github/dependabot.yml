version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    ignore:
      # Angular 22 requires TypeScript >=6.0.0 <6.1.0. Revisit when upgrading Angular.
      - dependency-name: typescript
        versions: [">=6.1.0"]
    groups:
      development-tools:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
