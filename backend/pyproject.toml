[project]
name = "portfolio-backend"
version = "0.1.0"
description = "FastAPI backend for the portfolio recruiter assistant"
readme = "README.md"
authors = [
    { email = "ayushthakur2009@gmail.com" }
]
requires-python = ">=3.14,<3.15"
dependencies = [
    "chromadb==1.5.9",
    "fastapi==0.165.0",
    "filelock==4.3.1",
    "jsonschema==4.26.0",
    "langchain-core==1.8.4",
    "langchain-google-genai==4.5.2",
    "langchain-text-splitters==1.2.0",
    "langsmith==0.16.1",
    "pydantic==2.14.4",
    "pydantic-settings==2.16.3",
    "uvicorn==0.54.0",
]

[project.scripts]
dev = "app.cli:dev"
start = "app.cli:start"
ingest = "app.rag.cli:ingest"
ask = "app.rag.cli:ask"
retrieve = "app.rag.cli:retrieve"
inspect-index = "app.rag.cli:inspect_index"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = ""

[tool.vercel]
entrypoint = "app.main:app"
