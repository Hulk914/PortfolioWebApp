[project]
name = "portfolio-backend"
version = "0.1.0"
description = "FastAPI backend for the portfolio recruiter assistant"
readme = "README.md"
authors = [
    { email = "ayushthakur2009@gmail.com" }
]
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi==0.165.0",
    "pydantic==2.14.4",
    "pydantic-settings==2.16.3",
    "uvicorn==0.54.0",
]

[project.scripts]
dev = "app.cli:dev"
start = "app.cli:start"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = ""
